---
# cPanel "Git™ Version Control" deployment.
#
# Set the deployment path below to your own account, then in cPanel open
# Git Version Control → Manage → Pull or Deploy → Deploy HEAD Commit.
# cPanel runs these tasks as your user after every deploy you trigger.
#
# Change DEPLOYPATH and nothing else.
deployment:
  tasks:
    - export DEPLOYPATH=/home/CPANELUSER/public_html/studio
    - /bin/mkdir -p $DEPLOYPATH
    # The app itself. data/ is deliberately not in this list: it holds your
    # scenes, splits and keys, and a deploy must never overwrite them.
    - /bin/cp -R index.php login.php install.php health.php config.sample.php .htaccess $DEPLOYPATH/
    - /bin/cp -R api lib assets overlay docs $DEPLOYPATH/
    - /bin/mkdir -p $DEPLOYPATH/data
    - /bin/chmod 755 $DEPLOYPATH/data
    # Keep the deny rules even if the host strips dotfiles from the copy.
    - /bin/sh -c 'printf "Require all denied\n" > $DEPLOYPATH/data/.htaccess'
    - /bin/sh -c 'test -f $DEPLOYPATH/data/index.html || touch $DEPLOYPATH/data/index.html'
    # Tests, the relay and the bridges are development files; a live web root
    # does not need them.
    - /bin/rm -rf $DEPLOYPATH/tests $DEPLOYPATH/relay $DEPLOYPATH/bridge $DEPLOYPATH/.github
