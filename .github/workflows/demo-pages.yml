name: demo (GitHub Pages)

# Publishes the server-free demo build to GitHub Pages, so the studio has a
# live page anyone can click. Enable it once in Settings → Pages → Source:
# GitHub Actions, then run this from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'assets/**'
      - 'overlay/**'
      - 'index.php'
      - 'deploy/build-demo.sh'
      - '.github/workflows/demo-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: 'json, xml', coverage: none }

      - name: Build the demo
        run: bash deploy/build-demo.sh dist-demo

      # Pages serves it from a subpath, and the demo has no server, so make
      # sure nothing in it assumes either.
      - name: Check the build
        run: |
          test -f dist-demo/index.html
          test -f dist-demo/assets/js/main.js
          test -f dist-demo/overlay/timer.html
          ! grep -rq 'api/index.php' dist-demo/index.html
          echo "Built $(find dist-demo -type f | wc -l) files"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist-demo }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
