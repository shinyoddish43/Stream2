name: deploy

# Manual on purpose: pushing to a branch should not change what your viewers
# are looking at. Run it from the Actions tab when you want the live site
# updated.
on:
  workflow_dispatch:
    inputs:
      method:
        description: 'How to reach the host'
        required: true
        default: 'ftp'
        type: choice
        options: [ftp, ssh]
      health_url:
        description: 'Public URL of the install, checked after deploying (optional)'
        required: false
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: 'json, xml', coverage: none }

      # Never deploy something that does not parse.
      - name: Lint PHP
        run: find . -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

      - name: Run the tests that need no browser
        run: |
          node tests/store.test.mjs
          node tests/timer.test.mjs
          php tests/php.test.php
          bash tests/api.test.sh

      - name: Stage the files that belong on a web host
        run: |
          mkdir -p ../stage
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'data' --exclude 'tests' \
            --exclude 'relay' --exclude 'bridge' --exclude 'deploy' \
            --exclude 'node_modules' --exclude '*.log' --exclude '__pycache__' \
            ./ ../stage/
          mkdir -p ../stage/data
          printf 'Require all denied\n' > ../stage/data/.htaccess
          : > ../stage/data/index.html
          echo "Staged $(find ../stage -type f | wc -l) files"

      # FTPS is what most cPanel hosts offer. lftp mirrors the tree and leaves
      # data/ alone, so a deploy never touches the live scenes or stream keys.
      - name: Upload over FTPS
        if: inputs.method == 'ftp'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          if [ -z "$FTP_HOST" ]; then
            echo "::error::Set the FTP_HOST, FTP_USER, FTP_PASSWORD and FTP_PATH secrets first."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set ftp:ssl-force true;
            set ssl:verify-certificate true;
            open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';
            mirror --reverse --delete --verbose=1 \
              --exclude-glob data/ \
              ../stage '$FTP_PATH';
          "

      - name: Upload over SSH
        if: inputs.method == 'ssh'
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_TARGET: ${{ secrets.SSH_TARGET }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_TARGET" ]; then
            echo "::error::Set the SSH_PRIVATE_KEY, SSH_TARGET and SSH_KNOWN_HOSTS secrets first."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -az --delete-after --exclude 'data' \
            -e "ssh -i ~/.ssh/id_deploy" ../stage/ "$SSH_TARGET/"

      - name: Check the live install
        if: inputs.health_url != ''
        run: |
          URL="${{ inputs.health_url }}"
          echo "Checking ${URL%/}/health.php"
          BODY="$(curl -fsS "${URL%/}/health.php?format=json" || true)"
          if [ -z "$BODY" ]; then
            echo "::warning::No JSON from health.php — it needs a login once the studio is installed. Check it in a browser."
            exit 0
          fi
          echo "$BODY"
          echo "$BODY" | grep -q '"status":"bad"' && { echo "::error::The live install failed its health check."; exit 1; }
          echo "Live install is healthy."
